<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table style="width: 100%; border-collapse: collapse; border: solid;">
        <thead>
            <tr style="border: solid; border-width: 1px;">
                <th style="border: solid; border-width: 1px;">Name</th>
                <th style="border: solid; border-width: 1px;">Age</th>
                <th style="border: solid; border-width: 1px;">Gender</th>
            </tr>
        </thead>
        <tbody style="text-align: center;">
            <tr>
                <td style="border: solid; border-width: 1px;">Aryan</td>
                <td style="border: solid; border-width: 1px;">17</td>
                <td style="border: solid; border-width: 1px;">Male</td>
            </tr>
            <tr>
                <td style="border: solid; border-width: 1px;">Arjit</td>
                <td style="border: solid; border-width: 1px;">18</td>
                <td style="border: solid; border-width: 1px;">Male</td>
            </tr>
            <tr>
                <td rowspan="2" style="border: solid; border-width: 1px;">Misa</td>
                <td style="border: solid; border-width: 1px;">19</td>
                <td style="border: solid; border-width: 1px;">Female</td>
            </tr>
            <tr>
                <td colspan="2" style="border: solid; border-width: 1px;">Unknown</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
